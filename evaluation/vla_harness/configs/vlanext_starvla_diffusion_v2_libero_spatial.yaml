# StarVLA-bridged VLANeXt (diffusion v2): libero_spatial 50 episodes per task
server:
  url: "ws://localhost:8000"

docker:
  image: vla-eval-rocm/libero:latest
  gpus: "none"

output_dir: "./results/vlanext_starvla_diffusion_v2_spatial_50ep"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_spatial
    mode: sync
    episodes_per_task: 50
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
      max_steps: 300
