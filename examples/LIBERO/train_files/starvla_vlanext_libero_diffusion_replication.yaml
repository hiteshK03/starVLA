run_id: vlanext_libero_spatial_diffusion_v2
run_root_dir: results/Checkpoints
seed: 2026
trackers: [jsonl, wandb]
wandb_entity: v1an1
wandb_project: vlanext_starvla
is_debug: false

framework:
  name: QwenVLANeXt
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    policy_hidden_size: 1024
    policy_depth: 29
    policy_num_heads: 16
    policy_mlp_ratio: 4.0
    num_queries: 16
    action_horizon: 8
    past_action_window_size: 0
    condition_type: soft
    use_proprio_input_vlm: true
    use_transformer_proprio_projector: false
    projector_depth: 2
    projector_num_heads: 4
    # Diffusion (flow matching) — matches VLANeXt exactly
    loss_type: diffusion
    num_train_timesteps: 1000
    num_inference_timesteps: 10
    # DCT auxiliary loss — matches VLANeXt exactly
    dct_loss_weight: 0.1
    dct_freq_split: 0.125
    dct_low_freq_weight: 1.0
    dct_high_freq_weight: 1.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO
    data_mix: libero_spatial
    action_type: delta_qpos
    sequential_step_sampling: false
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    include_state: true
    proprio_gripper_normalize: true
    augmentation:
      enabled: true
      random_resized_crop:
        scale: [0.8, 1.0]
        ratio: [0.9, 1.1]
      random_brightness: [0.2]
      random_contrast: [0.8, 1.2]
      random_saturation: [0.8, 1.2]
      random_hue: [0.05]
      augment_order:
        - "random_resized_crop"
        - "random_brightness"
        - "random_contrast"
        - "random_saturation"
        - "random_hue"

trainer:
  epochs: 100
  max_train_steps: 10000
  num_warmup_steps: 500
  is_resume: true
  pretrained_checkpoint: ""
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 1.0e-04
    action_head: 1.0e-04
  lr_scheduler_type: cosine
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.01
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
