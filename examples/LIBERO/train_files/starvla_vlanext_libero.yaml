run_id: vlanext_libero_spatial
run_root_dir: results/Checkpoints
seed: 2026
trackers: [jsonl, wandb]
wandb_entity: hkandala
wandb_project: vlanext_starvla
is_debug: false

framework:
  name: QwenVLANeXt
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    policy_hidden_size: 1024
    policy_depth: 29
    policy_num_heads: 16
    policy_mlp_ratio: 4.0
    num_queries: 16
    action_horizon: 8
    past_action_window_size: 0
    num_train_timesteps: 1000
    num_inference_timesteps: 5
    condition_type: soft
    use_proprio_input_vlm: true
    use_transformer_proprio_projector: false  # matches VLANeXt pretrained (simple Linear)
    projector_depth: 2
    projector_num_heads: 4
    dct_loss_weight: 0.1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LIBERO
    data_mix: libero_spatial  # change to libero_goal / libero_object / libero_10 per suite
    action_type: delta_qpos
    sequential_step_sampling: false
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 10000
  num_warmup_steps: 500
  is_resume: true
  pretrained_checkpoint: results/Checkpoints/vlanext_libero_spatial/checkpoints/pretrained_pytorch_model.pt
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 7.5e-05
    qwen_vl_interface: 7.5e-06
    action_head: 7.5e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
